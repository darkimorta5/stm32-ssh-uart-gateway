<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="258" viewBox="0 0 1120 258" role="img" aria-labelledby="title desc">
  <title id="title">Intended STM32 SSH UART gateway architecture</title>
  <desc id="desc">Ethernet connects to an SSH adapter, then the STM32 forwarding core, USB Host, FTDI, and a UART console. Only the portable C forwarding core is implemented in this repository. The other components require platform integration.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#526273"/></marker>
  </defs>
  <rect width="1120" height="258" rx="12" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" fill="#172b43">
    <text x="28" y="34" font-size="20" font-weight="bold">Intended hardware path</text>
    <text x="28" y="59" font-size="14">Only the portable forwarding core is implemented here. Platform adapters remain to be built.</text>
    <g fill="#ffffff" stroke="#8a96a6" stroke-width="1.5" stroke-dasharray="5 4">
      <rect x="28" y="92" width="142" height="76" rx="8"/>
      <rect x="208" y="92" width="142" height="76" rx="8"/>
      <rect x="596" y="92" width="142" height="76" rx="8"/>
      <rect x="776" y="92" width="142" height="76" rx="8"/>
      <rect x="956" y="92" width="136" height="76" rx="8"/>
    </g>
    <rect x="388" y="84" width="170" height="92" rx="8" fill="#e5f4ef" stroke="#197357" stroke-width="2"/>
    <g text-anchor="middle" font-size="17">
      <text x="99" y="137">Ethernet</text>
      <text x="279" y="125">SSH</text><text x="279" y="148" font-size="13">adapter</text>
      <text x="473" y="119">STM32</text><text x="473" y="143" font-size="14">C forwarding core</text><text x="473" y="164" font-size="12">host verified</text>
      <text x="667" y="125">USB Host</text><text x="667" y="148" font-size="13">adapter</text>
      <text x="847" y="125">FTDI</text><text x="847" y="148" font-size="13">serial device</text>
      <text x="1024" y="125">UART</text><text x="1024" y="148" font-size="13">target console</text>
    </g>
    <g stroke="#526273" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M177 130H201"/><path d="M357 130H381"/><path d="M565 130H589"/><path d="M745 130H769"/><path d="M925 130H949"/>
    </g>
    <text x="28" y="215" font-size="15">Host demo: synthetic SSH events → actual C core → synthetic transport callbacks</text>
    <text x="28" y="238" font-size="14" fill="#526273">No network connection, USB access, target login, or hardware test is performed by the demo.</text>
  </g>
</svg>
